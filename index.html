<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7">
<title>每日三件事</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#1C1C1E; --sub:#8E8E93; --line:#E5E5EA;
  --accent:#0A84FF; --orange:#FF9500; --green:#34C759; --red:#FF3B30;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000000; --card:#1C1C1E; --text:#FFFFFF; --sub:#8E8E93; --line:#2C2C2E; }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;}
body{background:var(--bg);color:var(--text);max-width:520px;margin:0 auto;
  padding:0 16px calc(84px + env(safe-area-inset-bottom));}
h1{font-size:28px;font-weight:700;padding:24px 4px 4px;}
.sub{color:var(--sub);font-size:14px;padding:0 4px 16px;}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;border:0.5px solid var(--line);}
.card-title{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:12px;letter-spacing:0.5px;}
/* 任务行 */
.task{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:0.5px solid var(--line);font-size:16px;}
.task:last-child{border-bottom:none;}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--sub);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .15s;}
.box.on{background:var(--green);border-color:var(--green);}
.box svg{opacity:0;transition:opacity .15s;}
.box.on svg{opacity:1;}
.task.done span{color:var(--sub);text-decoration:line-through;}
/* 输入 */
input[type=text],textarea{width:100%;border:none;background:transparent;color:var(--text);
  font-size:16px;font-family:inherit;outline:none;}
.task-input{border-bottom:0.5px solid var(--line);padding:12px 2px;display:flex;gap:10px;align-items:center;font-size:16px;}
.task-input .num{color:var(--sub);font-weight:600;width:20px;}
textarea{min-height:72px;resize:none;line-height:1.5;}
/* 按钮 */
.btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-size:17px;font-weight:600;
  font-family:inherit;background:var(--accent);color:#fff;margin-top:12px;}
.btn:active{opacity:.7;}
.btn.gray{background:var(--card);color:var(--accent);border:0.5px solid var(--line);}
.btn.orange{background:var(--orange);}
.btn.small{width:auto;padding:8px 14px;font-size:14px;margin:0;}
/* 提示条 */
.hint{font-size:14px;color:var(--sub);padding:12px 4px;line-height:1.6;}
.hint b{color:var(--text);}
/* 参考横幅 */
.ref{font-size:13px;color:var(--sub);background:var(--card);border:0.5px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:12px;line-height:1.6;}
.ref b{color:var(--text);}
/* 分数 */
.score-row{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 4px;}
.score-num{font-size:44px;font-weight:700;color:var(--accent);}
.score-num small{font-size:18px;color:var(--sub);font-weight:400;}
input[type=range]{width:100%;accent-color:var(--accent);height:34px;}
/* 打卡完成卡 */
.donecard{text-align:center;padding:28px 16px;}
.donecard .big{font-size:52px;}
.donecard h2{font-size:22px;margin:8px 0 4px;}
.donecard p{color:var(--sub);font-size:14px;line-height:1.7;}
.donecard .quote{margin-top:14px;font-size:14px;color:var(--text);background:var(--bg);
  border-radius:10px;padding:12px;line-height:1.6;}
/* 统计 */
.seg{display:flex;background:var(--card);border:0.5px solid var(--line);border-radius:10px;padding:2px;margin-bottom:14px;}
.seg button{flex:1;border:none;background:transparent;padding:8px;font-size:15px;color:var(--sub);
  border-radius:8px;font-family:inherit;font-weight:600;}
.seg button.on{background:var(--text);color:var(--bg);}
.stat-hero{display:flex;gap:10px;margin-bottom:12px;}
.stat-box{flex:1;background:var(--card);border:0.5px solid var(--line);border-radius:14px;padding:14px;text-align:center;}
.stat-box .v{font-size:24px;font-weight:700;}
.stat-box .l{font-size:12px;color:var(--sub);margin-top:2px;}
.bar-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;}
.bar-row .d{width:44px;color:var(--sub);flex-shrink:0;}
.bar-row .full{flex:1;}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);}
.bar i.fullbar{background:var(--orange);}
.bar-row .pct{width:38px;text-align:right;color:var(--sub);flex-shrink:0;}
.sum-item{padding:10px 2px;border-bottom:0.5px solid var(--line);font-size:14px;line-height:1.6;}
.sum-item:last-child{border:none;}
.sum-item .sd{color:var(--sub);font-size:12px;margin-bottom:2px;}
/* 小确幸 */
.joy-result{text-align:center;padding:36px 16px;}
.joy-result .emoji{font-size:46px;margin-bottom:10px;}
.joy-result .txt{font-size:22px;font-weight:700;margin-bottom:6px;}
.joy-result .src{color:var(--sub);font-size:13px;}
.joy-item{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;
  border-bottom:0.5px solid var(--line);font-size:16px;}
.joy-item:last-child{border:none;}
.joy-del{color:var(--red);font-size:15px;padding:6px 10px;}
.add-row{display:flex;gap:8px;margin-top:4px;}
.add-row input{flex:1;background:var(--card);border:0.5px solid var(--line);border-radius:10px;
  padding:12px 14px;font-size:16px;color:var(--text);}
/* 底部标签栏 */
.tabbar{position:fixed;bottom:0;left:0;right:0;height:calc(64px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.82);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:0.5px solid var(--line);display:flex;max-width:520px;margin:0 auto;}
@media (prefers-color-scheme: dark){.tabbar{background:rgba(30,30,30,.82);}}
.tabbar button{flex:1;border:none;background:transparent;font-family:inherit;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--sub);font-size:11px;}
.tabbar button.on{color:var(--accent);}
.view{display:none;}
.view.on{display:block;}
.empty{color:var(--sub);text-align:center;padding:30px 0;font-size:14px;}
</style>
<base target="_blank">
</head>
<body>

<h1 id="h-date">每日三件事</h1>
<div class="sub" id="h-sub"></div>

<!-- ============ 今天 ============ -->
<div class="view on" id="view-today"></div>

<!-- ============ 统计 ============ -->
<div class="view" id="view-stats">
  <div class="seg">
    <button id="seg-week" class="on" onclick="setPeriod('week')">本周</button>
    <button id="seg-month" onclick="setPeriod('month')">本月</button>
  </div>
  <div class="stat-hero">
    <div class="stat-box"><div class="v" id="st-rate">–</div><div class="l">任务完成率</div></div>
    <div class="stat-box"><div class="v" id="st-full">–</div><div class="l">满分天数</div></div>
    <div class="stat-box"><div class="v" id="st-score">–</div><div class="l">平均自评</div></div>
  </div>
  <div class="card"><div class="card-title">每日完成度</div><div id="st-bars"></div></div>
  <div class="card"><div class="card-title">这个周期的每日总结</div><div id="st-sums"></div></div>
</div>

<!-- ============ 小确幸 ============ -->
<div class="view" id="view-joys">
  <div class="card joy-result">
    <div class="emoji">🎁</div>
    <div class="txt" id="joy-txt">点下面按钮，抽一条</div>
    <div class="src" id="joy-src"></div>
    <button class="btn orange" onclick="drawJoy()">抽一条小确幸</button>
  </div>
  <div class="card">
    <div class="card-title">我收集的（会被随机到）</div>
    <div id="joy-user-list"></div>
    <div class="add-row">
      <input type="text" id="joy-new" placeholder="比如：明早吃小笼包">
      <button class="btn small" onclick="addJoy()">添加</button>
    </div>
  </div>
  <div class="hint">内置 90 条经典小确幸，加你自己的一起随机。<b>每天做完三件事后，记得去「今天」页把它勾掉。</b></div>
</div>

<!-- ============ 标签栏 ============ -->
<nav class="tabbar">
  <button class="on" onclick="switchTab('today',this)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></svg>今天</button>
  <button onclick="switchTab('stats',this)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>统计</button>
  <button onclick="switchTab('joys',this)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13"/><path d="M19 12v2M5 12v2M12 8s-4 0-4-2.5S12 3 12 8Zm0 0s4 0 4-2.5S12 3 12 8Z"/></svg>小确幸</button>
</nav>

<script>
/* ================= 数据 ================= */
var BUILTIN = ["吃一顿火锅","看一部电影","午睡20分钟","认真喝一杯好咖啡","给久未联系的朋友打个电话","散步30分钟不看手机","买一束花放在桌上","看一次落日","完整听一张专辑","泡个热水澡","尝试做一道新菜","整理手机相册10分钟","晚上11点前上床","撸猫/撸狗15分钟","玩一局喜欢的游戏","写一页纸质日记","骑车兜风","去菜市场挑新鲜的菜","看一集纪录片","做一次肩颈拉伸","坐在太阳下发呆10分钟","读30分钟闲书","点一支香薰蜡烛","彻底清空一个抽屉","给植物浇水擦叶子","逛书店买一本书","吃一块蛋糕","和家人视频聊天","拍一张今天最满意的照片","跑步或快走5公里","做一件小手作","晚上看星星或月亮","骑车或步行通勤","给一年后的自己写封信","去公园野餐","大声唱半小时歌","打卡一家新餐厅","给自己做一份丰盛早餐","修理一件坏了的小东西","拼一段乐高","敷一张面膜","看一场线下演出","在地图上随机选个地方周末去","给父母买个小礼物","雨天在家听雨","早起看一次日出","去河边或海边走走","学一道快手菜","给朋友手写一张卡片","换一套干净的床单被罩","发呆什么都不做","给手机换张壁纸","翻看去年的朋友圈","喝一壶茶慢慢聊天","吃当季水果","给自己剪指甲修手","收拾背包和钱包","看一场体育比赛","玩飞盘或羽毛球","做10分钟冥想","晒被子","去美术馆或展览馆","吃一碗热汤面","给自行车洗个澡","看老照片","买一双舒服的袜子","整理电脑桌面","给欣赏的人写封信","云旅游一个想去的地方","做一道甜品","理发或修眉","做个足部按摩","看一集TED","清理冰箱","给房间换个布局","写3个本周小成就","戴耳机走一条没走过的路","吃个冰淇淋","泡一杯热可可","看宠物视频15分钟","给自己买个小礼物","练一页字","叠好所有衣服","捐掉一件衣服","早起为自己做早餐","打一局台球或乒乓球","去图书馆坐一会","在阳台种点东西","和爱人认真约个会","什么都不做，早点睡"];

var days  = JSON.parse(localStorage.getItem('mrsj_days') || '{}');
var ujoys = JSON.parse(localStorage.getItem('mrsj_joys') || '[]');
function saveDays(){ localStorage.setItem('mrsj_days', JSON.stringify(days)); }
function saveJoys(){ localStorage.setItem('mrsj_joys', JSON.stringify(ujoys)); }

function pad(n){ return (n<10?'0':'') + n; }
function keyOf(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
var TODAY = keyOf(new Date());
var WEEK = ['日','一','二','三','四','五','六'];

function allJoys(){ return BUILTIN.concat(ujoys); }
function randomJoy(){
  var a = allJoys(), s = a[Math.floor(Math.random()*a.length)];
  return { text: s, mine: ujoys.indexOf(s) >= 0 };
}
function streak(){
  var n = 0, d = new Date();
  if(!isFull(days[TODAY])) d.setDate(d.getDate()-1);
  while(isFull(days[keyOf(d)])){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function isFull(rec){ return rec && rec.tasks.every(function(t){return t.d;}); }

/* ================= 今天 ================= */
function renderToday(){
  var el = document.getElementById('view-today');
  var rec = days[TODAY];
  var h = '';

  /* 昨天未完成 —— 仅参考，绝不延续 */
  var yd = new Date(); yd.setDate(yd.getDate()-1);
  var yrec = days[keyOf(yd)];
  if(yrec){
    var left = yrec.tasks.filter(function(t){return !t.d;}).map(function(t){return t.t;});
    if(left.length){
      h += '<div class="ref">昨天有 <b>' + left.length + '</b> 件没完成：' + left.join('、')
        + '<br>系统不会把它带到今天——如果依然重要，请在下面重新写下它。</div>';
    }
  }

  if(!rec){
    /* 晨间：还没定 */
    h += '<div class="card"><div class="card-title">写下今天最重要的三件事</div>'
      + '<div class="task-input"><span class="num">1</span><input type="text" id="in1" placeholder="最重要的那一件"></div>'
      + '<div class="task-input"><span class="num">2</span><input type="text" id="in2" placeholder="第二件"></div>'
      + '<div class="task-input"><span class="num">3</span><input type="text" id="in3" placeholder="第三件"></div>'
      + '<button class="btn" onclick="morningSave()">定好了，抽个小确幸</button></div>'
      + '<div class="hint">够小、够具体，今天就能做完。<b>当天没做完不会自动延续到明天。</b></div>';
  } else {
    /* 任务列表 */
    h += '<div class="card"><div class="card-title">今日三件事</div>';
    rec.tasks.forEach(function(t, i){
      h += '<div class="task' + (t.d?' done':'') + '" onclick="toggleTask(' + i + ')">'
        + '<div class="box' + (t.d?' on':'') + '"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg></div>'
        + '<span>' + escapeHtml(t.t) + '</span></div>';
    });
    h += '</div>';

    /* 小确幸行 */
    h += '<div class="card"><div class="card-title">今日小确幸</div>'
      + '<div class="task' + (rec.joyDone?' done':'') + '" onclick="toggleJoy()">'
      + '<div class="box' + (rec.joyDone?' on':'') + '"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg></div>'
      + '<span>🎁 ' + escapeHtml(rec.joy) + '</span></div>'
      + (!rec.joyDone ? '<button class="btn gray" onclick="reroll()">换一条</button>' : '')
      + '</div>';

    var full = isFull(rec);
    if(full && rec.score === null){
      /* 打分 + 总结 */
      h += '<div class="card"><div class="card-title">三件事完成 ✅ 写总结、打分</div>'
        + '<div class="score-row"><span class="card-title" style="margin:0">今天给自己打几分</span>'
        + '<span class="score-num"><span id="score-v">7</span><small> / 10</small></span></div>'
        + '<input type="range" min="0" max="10" value="7" oninput="updScore(this.value)">
        + '<div style="height:12px"></div>'
        + '<textarea id="in-summary" placeholder="用一两句话总结今天（会进周报月报）"></textarea>'
        + '<button class="btn orange" onclick="eveningSave()">完成打卡</button></div>';
    } else if(full && rec.score !== null){
      /* 已完成卡片 */
      h += '<div class="card donecard"><div class="big">🎉</div><h2>今日已打卡</h2>'
        + '<p>自评 ' + rec.score + ' / 10　·　小确幸' + (rec.joyDone?' ✅':' 还没做') + '</p>'
        + '<div class="quote">' + (rec.summary ? escapeHtml(rec.summary) : '（今天没写总结）') + '</div></div>';
    } else {
      var left = rec.tasks.filter(function(t){return !t.d;}).length;
      h += '<div class="hint">还差 <b>' + left + '</b> 件。没做完的<b>不会带到明天</b>——想做的话，明早重新写一遍。</div>';
    }
  }
  el.innerHTML = h;
}

function morningSave(){
  var t1 = document.getElementById('in1').value.trim();
  var t2 = document.getElementById('in2').value.trim();
  var t3 = document.getElementById('in3').value.trim();
  if(!t1 || !t2 || !t3){ alert('三件事都要写哦，哪怕很小'); return; }
  days[TODAY] = { tasks:[{t:t1,d:false},{t:t2,d:false},{t:t3,d:false}],
    joy: randomJoy().text, joyDone:false, score:null, summary:'' };
  saveDays(); renderToday();
}
function toggleTask(i){
  var rec = days[TODAY]; if(!rec) return;
  rec.tasks[i].d = !rec.tasks[i].d; saveDays(); renderToday();
}
function toggleJoy(){
  var rec = days[TODAY]; if(!rec) return;
  rec.joyDone = !rec.joyDone; saveDays(); renderToday();
}
function reroll(){
  var rec = days[TODAY]; if(!rec || rec.joyDone) return;
  rec.joy = randomJoy().text; saveDays(); renderToday();
}
function updScore(v){
document.getElementById('score-v').textContent = v;
}

  function eveningSave(){
  var rec = days[TODAY]; if(!rec) return;
  rec.summary = document.getElementById('in-summary').value.trim();
  rec.score = parseInt(document.querySelector('input[type=range]').value, 10);
  saveDays(); renderToday();
}

/* ================= 统计 ================= */
var period = 'week';
function setPeriod(p){
  period = p;
  document.getElementById('seg-week').className = p==='week' ? 'on' : '';
  document.getElementById('seg-month').className = p==='month' ? 'on' : '';
  renderStats();
}
function periodDates(){
  var arr = [], d = new Date(), start = new Date();
  if(period === 'week'){
    var dow = (d.getDay() + 6) % 7;      /* 周一=0 */
    start.setDate(d.getDate() - dow);
  } else {
    start.setDate(1);
  }
  while(start <= d){ arr.push(keyOf(start)); start.setDate(start.getDate()+1); }
  return arr;
}
function renderStats(){
  var dates = periodDates();
  var doneN = 0, totalN = 0, fullN = 0, scoreSum = 0, scoreCnt = 0;
  var bars = '', sums = '';
  dates.forEach(function(k){
    var rec = days[k];
    var dstr = k.slice(5);
    if(!rec){
      bars += '<div class="bar-row"><span class="d">' + dstr + '</span><span class="full"><div class="bar"><i style="width:0%"></i></div></span><span class="pct">—</span></div>';
      return;
    }
    var dn = rec.tasks.filter(function(t){return t.d;}).length;
    doneN += dn; totalN += 3;
    if(dn === 3) fullN++;
    if(rec.score !== null){ scoreSum += rec.score; scoreCnt++; }
    var pct = Math.round(dn/3*100);
    bars += '<div class="bar-row"><span class="d">' + dstr + '</span><span class="full"><div class="bar"><i class="' + (dn===3?'fullbar':'') + '" style="width:' + pct + '%"></i></div></span><span class="pct">' + pct + '%</span></div>';
    if(rec.summary){
      sums += '<div class="sum-item"><div class="sd">' + dstr + (rec.score!==null ? ' · 自评 ' + rec.score : '') + '</div>' + escapeHtml(rec.summary) + '</div>';
    }
  });
  document.getElementById('st-rate').textContent  = totalN ? Math.round(doneN/totalN*100) + '%' : '–';
  document.getElementById('st-full').textContent  = fullN;
  document.getElementById('st-score').textContent = scoreCnt ? (scoreSum/scoreCnt).toFixed(1) : '–';
  document.getElementById('st-bars').innerHTML = bars || '<div class="empty">本周还没有记录</div>';
  document.getElementById('st-sums').innerHTML = sums || '<div class="empty">完成三件事并写总结后，会出现在这里</div>';
}

/* ================= 小确幸 ================= */
function drawJoy(){
  var j = randomJoy();
  document.getElementById('joy-txt').textContent = j.text;
  document.getElementById('joy-src').textContent = j.mine ? '来自你的收藏' : '来自内置库';
}
function renderJoys(){
  var el = document.getElementById('joy-user-list');
  if(!ujoys.length){ el.innerHTML = '<div class="empty">还没有收藏，加一条试试</div>'; return; }
  el.innerHTML = ujoys.map(function(j, i){
    return '<div class="joy-item"><span>' + escapeHtml(j) + '</span><span class="joy-del" onclick="delJoy(' + i + ')">删除</span></div>';
  }).join('');
}
function addJoy(){
  var v = document.getElementById('joy-new').value.trim();
  if(!v) return;
  ujoys.push(v); saveJoys(); renderJoys();
  document.getElementById('joy-new').value = '';
}
function delJoy(i){ ujoys.splice(i,1); saveJoys(); renderJoys(); }

/* ================= 通用 ================= */
function switchTab(name, btn){
  document.querySelectorAll('.view').forEach(function(v){ v.className = 'view'; });
  document.getElementById('view-' + name).className = 'view on';
  document.querySelectorAll('.tabbar button').forEach(function(b){ b.className = ''; });
  btn.className = 'on';
  if(name === 'stats') renderStats();
  if(name === 'joys') renderJoys();
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* 头部 */
var now = new Date();
document.getElementById('h-date').textContent = (now.getMonth()+1) + '月' + now.getDate() + '日 周' + WEEK[now.getDay()];
var st = streak();
document.getElementById('h-sub').textContent = st > 0 ? '已连续满分 ' + st + ' 天 🔥' : '写下三件最重要的事';

renderToday();
